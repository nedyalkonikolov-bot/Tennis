name: Patch player stats UI

on:
  push:
    paths:
      - .github/workflows/patch-player-stats-ui.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch App.jsx player stats UI
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/App.jsx')
          text = path.read_text()

          normalize = r'''function normalizePlayer(player) {
            const recentMatches = Number(player.recent_matches ?? player.stored_matches ?? 0);
            const recentWins = Number(player.recent_wins ?? player.stored_wins ?? 0);
            const recentLosses = Number(player.recent_losses ?? Math.max(recentMatches - recentWins, 0));
            const recentWinRate = player.recent_win_rate === null || player.recent_win_rate === undefined ? null : Number(player.recent_win_rate);
            return {
              id: player.id || player.player_key || player.name,
              name: player.name,
              tour: player.tour || player.sex || "ATP",
              country: player.country || "World",
              rank: Number(player.rank ?? player.current_rank ?? 999999),
              points: Number(player.points || 0),
              movement: player.movement || player.trend || "same",
              recentMatches,
              recentWins,
              recentLosses,
              recentWinRate,
              form: recentWinRate ?? Number(player.form ?? player.form_rating ?? 0),
              predictionMentions: Number(player.prediction_mentions || 0),
              updatedAt: player.updated_at || "",
              url: player.url || `/players/${String(player.tour || player.sex || "ATP").toLowerCase()}/${slugify(player.name)}/`,
              slug: player.slug || slugify(player.name),
            };
          }
          '''
          text = re.sub(r"function normalizePlayer\(player\) \{[\s\S]*?\n\}\n\nfunction getRoute", normalize + "\nfunction getRoute", text, count=1)

          stats = r'''function StatsPage({ route, livePlayers, dbData, onNavigate }) {
            const [query, setQuery] = useState("");
            const [sortKey, setSortKey] = useState("rank");
            const [activeTour, setActiveTour] = useState(route.tour || "ATP");
            useEffect(() => { if (route.tour) setActiveTour(route.tour); }, [route.tour]);
            const sourcePlayers = dbData.playerPages.length ? dbData.playerPages : livePlayers;
            const filteredPlayers = useMemo(() => sourcePlayers.map(normalizePlayer).filter((player) => player.tour === activeTour).filter((player) => player.name.toLowerCase().includes(query.toLowerCase()) || player.country?.toLowerCase?.().includes(query.toLowerCase())).sort((a, b) => (sortKey === "rank" ? a.rank - b.rank : (b[sortKey] || 0) - (a[sortKey] || 0))), [sourcePlayers, activeTour, query, sortKey]);
            return <section className="mx-auto max-w-7xl px-5 py-12 md:px-6"><p className="text-sm font-semibold uppercase text-lime-300">Player database</p><h1 className="mt-2 text-4xl font-black">ATP and WTA Player Stats</h1><p className="mt-3 max-w-2xl text-slate-400">Top 500 ATP and top 500 WTA players, split by tour with ranking points and verified 100-day singles form from API-Tennis fixtures.</p><div className="mt-8 flex gap-2 overflow-x-auto">{tours.map((tour) => <button key={tour} type="button" onClick={() => { setActiveTour(tour); onNavigate(`/players/${tour.toLowerCase()}/`); }} className={`rounded-xl px-5 py-2 text-sm font-bold ${activeTour === tour ? "bg-lime-400 text-slate-950" : "bg-white/5 text-slate-300 hover:bg-white/10"}`}>{tour} Top 500</button>)}</div><div className="mt-5 grid gap-3 md:grid-cols-[1fr_auto]"><label className="flex items-center gap-3 bg-white/[0.04] px-4 py-3 ring-1 ring-white/10"><Search size={18} className="text-slate-500" /><input value={query} onChange={(event) => setQuery(event.target.value)} placeholder="Search player or country" className="w-full bg-transparent text-white outline-none placeholder:text-slate-500" /></label><select value={sortKey} onChange={(event) => setSortKey(event.target.value)} className="bg-slate-900 px-4 py-3 text-white ring-1 ring-white/10"><option value="rank">Sort by rank</option><option value="points">Sort by points</option><option value="recentWinRate">Sort by 100d win rate</option><option value="recentMatches">Sort by 100d matches</option><option value="recentWins">Sort by 100d wins</option><option value="predictionMentions">Sort by predictions</option></select></div><div className="mt-8 overflow-hidden border border-white/10"><div className="hidden grid-cols-[1.25fr_0.45fr_0.65fr_0.65fr_0.65fr_0.65fr_0.65fr] gap-3 bg-slate-900 px-5 py-3 text-xs font-bold uppercase text-slate-500 md:grid"><span>Player</span><span>Rank</span><span>Points</span><span>100d W-L</span><span>Win rate</span><span>Matches</span><span>Predictions</span></div>{filteredPlayers.map((player) => <button key={player.id || player.name} type="button" onClick={() => onNavigate(player.url)} className="grid w-full gap-4 border-t border-white/10 bg-white/[0.03] px-5 py-5 text-left hover:bg-white/[0.06] md:grid-cols-[1.25fr_0.45fr_0.65fr_0.65fr_0.65fr_0.65fr_0.65fr] md:items-center"><div><p className="font-bold text-white">{player.name}</p><p className="text-sm text-slate-500">{player.country} movement {player.movement}</p></div><p className="text-sm text-slate-300">#{player.rank}</p><p className="text-sm text-slate-300">{player.points}</p><p className="text-sm font-bold text-white">{player.recentWins}-{player.recentLosses}</p><div><p className="mb-2 text-sm font-bold text-white">{player.recentWinRate === null ? "N/A" : `${player.recentWinRate}%`}</p><StatBar value={player.recentWinRate || 0} /></div><p className="text-sm text-slate-300">{player.recentMatches}</p><p className="text-sm text-slate-300">{player.predictionMentions}</p></button>)}</div></section>;
          }
          '''
          text = re.sub(r"function StatsPage\([\s\S]*?\n\}\n\nfunction PlayerDetailPage", stats + "\nfunction PlayerDetailPage", text, count=1)

          detail = r'''function PlayerDetailPage({ route, dbData, onNavigate }) {
            const player = dbData.playerPages.map(normalizePlayer).find((item) => item.tour === route.tour && item.slug === route.slug);
            if (!player) return <NotFound title="Player profile loading" text="This player profile will appear after the database feed loads." />;
            return <section className="mx-auto max-w-7xl px-5 py-12 md:px-6"><button type="button" onClick={() => onNavigate(`/players/${player.tour.toLowerCase()}/`)} className="mb-6 text-sm font-bold text-lime-300">Back to {player.tour} players</button><p className="text-sm font-semibold uppercase text-lime-300">{player.tour} player profile</p><h1 className="mt-2 text-5xl font-black">{player.name}</h1><p className="mt-3 max-w-2xl text-slate-400">Ranking, points, and verified 100-day singles form for {player.name} from stored API-Tennis fixture results.</p><div className="mt-8 grid gap-4 md:grid-cols-4"><Metric label="Rank" value={`#${player.rank}`} helper={player.country} /><Metric label="Points" value={player.points} /><Metric label="100d W-L" value={`${player.recentWins}-${player.recentLosses}`} /><Metric label="100d win rate" value={player.recentWinRate === null ? "N/A" : `${player.recentWinRate}%`} helper={`${player.recentMatches} matches`} /></div><div className="mt-8 grid gap-5 md:grid-cols-3"><Metric label="Recent wins" value={player.recentWins} /><Metric label="Recent losses" value={player.recentLosses} /><Metric label="Prediction mentions" value={player.predictionMentions} /></div><div className="mt-8 border border-white/10 bg-white/[0.04] p-6"><h2 className="text-2xl font-black">Betting Research Notes</h2><p className="mt-4 leading-8 text-slate-400">Use {player.name}'s ranking, points, and 100-day win-loss record alongside Cloudbet odds, opponent form, tournament context and match timing before making any tennis betting decision. Synthetic hold, break and surface ratings have been removed until verified source data is available.</p></div></section>;
          }
          '''
          text = re.sub(r"function PlayerDetailPage\([\s\S]*?\n\}\n\nfunction MatchDetailPage", detail + "\nfunction MatchDetailPage", text, count=1)

          path.write_text(text)
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx
          if git diff --cached --quiet; then
            echo "No UI patch needed"
          else
            git commit -m "Show verified player stats"
            git push
          fi
