name: Hide prediction record page

on:
  push:
    paths:
      - .github/workflows/patch-hide-record-page.yml
      - scripts/patch-hide-record-page.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch app
        run: python scripts/patch-hide-record-page.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx
          if git diff --cached --quiet; then
            echo "No record page patch needed"
          else
            git commit -m "Hide public prediction record page"
            git push
          fi
