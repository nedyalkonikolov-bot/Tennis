name: Patch AI match pages

on:
  push:
    paths:
      - .github/workflows/patch-ai-match-pages.yml
      - scripts/patch-ai-match-pages.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch app
        run: python scripts/patch-ai-match-pages.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx
          if git diff --cached --quiet; then
            echo "No AI match page patch needed"
          else
            git commit -m "Show AI analysis on match pages"
            git push
          fi
