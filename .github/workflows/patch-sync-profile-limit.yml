name: Patch sync profile limit

on:
  push:
    paths:
      - .github/workflows/patch-sync-profile-limit.yml
      - scripts/patch-sync-profile-limit.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch sync profile limit
        run: python scripts/patch-sync-profile-limit.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add functions/api/db/sync.js
          if git diff --cached --quiet; then
            echo "No sync profile limit patch needed"
          else
            git commit -m "Limit profile enrichment in main sync"
            git push
          fi
