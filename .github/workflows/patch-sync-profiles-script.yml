name: Patch sync player profiles

on:
  push:
    paths:
      - .github/workflows/patch-sync-profiles-script.yml
      - scripts/patch-sync-profiles.cjs

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch sync.js
        run: node scripts/patch-sync-profiles.cjs
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add functions/api/db/sync.js
          if git diff --cached --quiet; then
            echo "No sync profile patch needed"
          else
            git commit -m "Sync API Tennis player profile stats"
            git push
          fi
