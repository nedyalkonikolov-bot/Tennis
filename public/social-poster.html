<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex,nofollow" />
    <title>TennisTipz Post Generator</title>
    <style>
      :root { color-scheme: dark; --bg:#0f172a; --panel:#111827; --line:#243047; --text:#e5e7eb; --muted:#9ca3af; --accent:#38bdf8; --good:#86efac; --danger:#f87171; }
      * { box-sizing: border-box; }
      body { margin:0; min-height:100vh; font-family:Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background:var(--bg); color:var(--text); }
      main { width:min(1080px, calc(100vw - 32px)); margin:0 auto; padding:32px 0 56px; }
      h1 { margin:0 0 8px; font-size:clamp(28px, 4vw, 42px); letter-spacing:0; }
      p { color:var(--muted); line-height:1.55; }
      .layout { display:grid; grid-template-columns:340px 1fr; gap:18px; align-items:start; }
      .panel { border:1px solid var(--line); background:var(--panel); border-radius:8px; padding:18px; }
      label { display:block; font-size:13px; color:var(--muted); margin:0 0 7px; }
      input, select, button, textarea { width:100%; border:1px solid var(--line); border-radius:7px; background:#0b1220; color:var(--text); padding:11px 12px; font:inherit; }
      input:focus, select:focus, textarea:focus { outline:2px solid rgba(56,189,248,.35); }
      .field { margin-bottom:14px; }
      .row { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
      button { cursor:pointer; font-weight:750; background:var(--accent); color:#082f49; border-color:transparent; }
      button.copy { width:auto; padding:8px 11px; font-size:13px; }
      button:disabled { opacity:.65; cursor:wait; }
      .status { min-height:42px; margin-top:14px; color:var(--muted); font-size:14px; }
      .status.error { color:var(--danger); }
      .result-list { display:grid; gap:12px; }
      .post { border:1px solid var(--line); border-radius:8px; padding:14px; background:#0b1220; }
      .post-head { display:flex; justify-content:space-between; gap:12px; align-items:start; margin-bottom:8px; }
      .post h2 { margin:0; font-size:16px; }
      .meta { color:var(--muted); font-size:13px; margin-bottom:10px; }
      textarea { min-height:210px; resize:vertical; line-height:1.45; }
      .pill { display:inline-flex; align-items:center; border-radius:999px; padding:4px 9px; margin:0 6px 6px 0; font-size:12px; background:#172033; color:var(--muted); }
      .ok { color:var(--good); }
      a { color:#7dd3fc; }
      @media (max-width:820px) { .layout { grid-template-columns:1fr; } .row { grid-template-columns:1fr; } }
    </style>
      <link rel="stylesheet" href="/ad-banners.css?v=navy-rails" />
  </head>
  <body>
    <main>
      <header>
        <h1>Post Generator</h1>
        <p>Generate copy-ready TennisTipz posts for X or Threads. This page only previews text; it does not publish anything.</p>
      </header>
      <div class="layout">
        <section class="panel">
          <div class="field">
            <label for="token">Sync token</label>
            <input id="token" type="password" autocomplete="off" placeholder="Enter sync token" />
          </div>
          <div class="row">
            <div class="field">
              <label for="platform">Style</label>
              <select id="platform">
                <option value="twitter">X</option>
                <option value="threads">Threads</option>
              </select>
            </div>
            <div class="field">
              <label for="limit">Posts</label>
              <select id="limit">
                <option value="1">1 post</option>
                <option value="2">2 posts</option>
                <option value="3">3 posts</option>
                <option value="5">5 posts</option>
              </select>
            </div>
          </div>
          <button id="generate">Generate posts</button>
          <div class="status" id="status">Ready.</div>
        </section>
        <section class="panel">
          <div class="result-list" id="results"></div>
        </section>
      </div>
    </main>
    <script>
      const tokenInput = document.getElementById('token');
      const platformInput = document.getElementById('platform');
      const limitInput = document.getElementById('limit');
      const statusEl = document.getElementById('status');
      const resultsEl = document.getElementById('results');
      const generateButton = document.getElementById('generate');
      tokenInput.value = sessionStorage.getItem('tennistipz_sync_token') || '';
      tokenInput.addEventListener('input', () => sessionStorage.setItem('tennistipz_sync_token', tokenInput.value));
      const escapeHtml = (value) => String(value || '').replace(/[&<>"]/g, (char) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[char]));
      function setStatus(message, isError = false) { statusEl.textContent = message; statusEl.classList.toggle('error', isError); }
      async function copyText(id) {
        const text = document.getElementById(id)?.value || '';
        await navigator.clipboard.writeText(text);
        setStatus('Copied post text.');
      }
      window.copyPost = copyText;
      function renderItem(kind, item, index) {
        const textId = 'post-text-' + index;
        const chars = (item.text || '').length;
        return `<article class="post">
          <div class="post-head">
            <div><h2>${escapeHtml(kind)} draft</h2><div class="meta"><span class="pill">${escapeHtml(item.predictionId || '')}</span><span class="pill">${escapeHtml(item.referral?.name || 'Referral')}</span><span class="pill">${chars} chars</span></div></div>
            <button class="copy" type="button" onclick="copyPost('${textId}')">Copy</button>
          </div>
          <p><a href="${escapeHtml(item.url)}" target="_blank" rel="noopener">Prediction page</a></p>
          <textarea id="${textId}" readonly>${escapeHtml(item.text || '')}</textarea>
        </article>`;
      }
      function render(payload) {
        const kind = platformInput.value === 'twitter' ? 'X' : 'Threads';
        const list = platformInput.value === 'twitter' ? (payload.tweets || []) : (payload.threads || []);
        resultsEl.innerHTML = list.length ? list.map((item, index) => renderItem(kind, item, index)).join('') : '<p>No available draft found.</p>';
      }
      async function generate() {
        const token = tokenInput.value.trim();
        if (!token) { setStatus('Enter the sync token first.', true); return; }
        generateButton.disabled = true;
        setStatus('Generating drafts...');
        resultsEl.innerHTML = '';
        try {
          const params = new URLSearchParams({ dryRun:'1', platform:platformInput.value, limit:limitInput.value });
          const response = await fetch('/api/automation/promote?' + params.toString(), { method:'POST', headers:{ 'x-sync-token': token } });
          const payload = await response.json();
          if (!response.ok || !payload.ok) throw new Error(payload.error || 'Request failed');
          render(payload);
          setStatus('Drafts ready. Copy and post manually.');
        } catch (error) {
          setStatus(error.message || 'Request failed.', true);
        } finally {
          generateButton.disabled = false;
        }
      }
      generateButton.addEventListener('click', generate);
    </script>
      <script src="/ad-banners.js?v=navy-rails" defer></script>
  </body>
</html>
