<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex,nofollow" />
    <title>TennisTipz Social Poster</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0f172a;
        --panel: #111827;
        --line: #243047;
        --text: #e5e7eb;
        --muted: #9ca3af;
        --accent: #22c55e;
        --accent-2: #38bdf8;
        --danger: #f87171;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: var(--bg);
        color: var(--text);
      }
      main {
        width: min(1080px, calc(100vw - 32px));
        margin: 0 auto;
        padding: 32px 0 56px;
      }
      header { margin-bottom: 24px; }
      h1 { margin: 0 0 8px; font-size: clamp(28px, 4vw, 42px); letter-spacing: 0; }
      p { color: var(--muted); line-height: 1.55; }
      .layout { display: grid; grid-template-columns: 360px 1fr; gap: 18px; align-items: start; }
      .panel {
        border: 1px solid var(--line);
        background: var(--panel);
        border-radius: 8px;
        padding: 18px;
      }
      label { display: block; font-size: 13px; color: var(--muted); margin: 0 0 7px; }
      input, select, button, textarea {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: #0b1220;
        color: var(--text);
        padding: 11px 12px;
        font: inherit;
      }
      input:focus, select:focus, textarea:focus { outline: 2px solid rgba(56, 189, 248, .35); }
      .field { margin-bottom: 14px; }
      .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
      .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 18px; }
      button {
        cursor: pointer;
        font-weight: 750;
        background: var(--accent);
        color: #052e16;
        border-color: transparent;
      }
      button.secondary { background: var(--accent-2); color: #082f49; }
      button:disabled { opacity: .65; cursor: wait; }
      .status {
        min-height: 44px;
        margin-top: 14px;
        color: var(--muted);
        font-size: 14px;
      }
      .status.error { color: var(--danger); }
      .result-list { display: grid; gap: 12px; }
      .post {
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 14px;
        background: #0b1220;
      }
      .post h2 { margin: 0 0 8px; font-size: 16px; }
      .meta { color: var(--muted); font-size: 13px; margin-bottom: 10px; }
      textarea { min-height: 190px; resize: vertical; line-height: 1.45; }
      .pill {
        display: inline-flex;
        align-items: center;
        border-radius: 999px;
        padding: 4px 9px;
        margin-right: 6px;
        font-size: 12px;
        background: #172033;
        color: var(--muted);
      }
      .ok { color: #86efac; }
      .bad { color: var(--danger); }
      a { color: #7dd3fc; }
      @media (max-width: 820px) {
        .layout { grid-template-columns: 1fr; }
        .row, .actions { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Social Poster</h1>
        <p>Preview or publish the next TennisTipz prediction through the same automation flow used for X and Threads. Use dry run first, then publish one post at a time.</p>
      </header>

      <div class="layout">
        <section class="panel">
          <div class="field">
            <label for="token">Sync token</label>
            <input id="token" type="password" autocomplete="off" placeholder="Enter sync token" />
          </div>
          <div class="row">
            <div class="field">
              <label for="platform">Platform</label>
              <select id="platform">
                <option value="twitter">X only</option>
                <option value="threads">Threads only</option>
                <option value="all">X + Threads</option>
              </select>
            </div>
            <div class="field">
              <label for="limit">Posts</label>
              <select id="limit">
                <option value="1">1 post</option>
                <option value="2">2 posts</option>
                <option value="3">3 posts</option>
              </select>
            </div>
          </div>
          <div class="actions">
            <button class="secondary" id="preview">Preview</button>
            <button id="publish">Publish</button>
          </div>
          <div class="status" id="status">Ready.</div>
        </section>

        <section class="panel">
          <div class="result-list" id="results"></div>
        </section>
      </div>
    </main>

    <script>
      const tokenInput = document.getElementById('token');
      const platformInput = document.getElementById('platform');
      const limitInput = document.getElementById('limit');
      const statusEl = document.getElementById('status');
      const resultsEl = document.getElementById('results');
      const buttons = [document.getElementById('preview'), document.getElementById('publish')];

      tokenInput.value = sessionStorage.getItem('tennistipz_sync_token') || '';
      tokenInput.addEventListener('input', () => sessionStorage.setItem('tennistipz_sync_token', tokenInput.value));

      function setBusy(busy) {
        buttons.forEach((button) => { button.disabled = busy; });
      }

      function setStatus(message, isError = false) {
        statusEl.textContent = message;
        statusEl.classList.toggle('error', isError);
      }

      function escapeHtml(value) {
        return String(value || '').replace(/[&<>"]/g, (char) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[char]));
      }

      function renderItem(kind, item) {
        const result = item.result || {};
        const ok = item.dryRun || result.ok;
        const status = item.dryRun ? 'Preview' : ok ? 'Posted' : 'Failed';
        const postId = result.payload?.data?.id || result.payload?.id || '';
        const failure = result.payload?.error?.message || result.payload?.detail || result.reason || '';
        const text = item.text || result.payload?.data?.text || '';
        return `
          <article class="post">
            <h2>${escapeHtml(kind)} <span class="pill ${ok ? 'ok' : 'bad'}">${escapeHtml(status)}</span></h2>
            <div class="meta">
              <span class="pill">${escapeHtml(item.predictionId || '')}</span>
              <span class="pill">${escapeHtml(item.referral?.name || 'Referral')}</span>
              ${postId ? `<span class="pill">ID ${escapeHtml(postId)}</span>` : ''}
            </div>
            ${failure ? `<p class="bad">${escapeHtml(failure)}</p>` : ''}
            <p><a href="${escapeHtml(item.url)}" target="_blank" rel="noopener">Prediction page</a></p>
            <textarea readonly>${escapeHtml(text || JSON.stringify(result, null, 2))}</textarea>
          </article>
        `;
      }

      function render(payload) {
        const parts = [];
        (payload.tweets || []).forEach((item) => parts.push(renderItem('X', item)));
        (payload.threads || []).forEach((item) => parts.push(renderItem('Threads', item)));
        resultsEl.innerHTML = parts.length ? parts.join('') : '<p>No available posts found for that platform.</p>';
      }

      async function run(dryRun) {
        const token = tokenInput.value.trim();
        if (!token) {
          setStatus('Enter the sync token first.', true);
          return;
        }

        setBusy(true);
        setStatus(dryRun ? 'Loading preview...' : 'Publishing...');
        resultsEl.innerHTML = '';
        try {
          const params = new URLSearchParams({ platform: platformInput.value, limit: limitInput.value });
          if (dryRun) params.set('dryRun', '1');
          const response = await fetch('/api/automation/promote?' + params.toString(), {
            method: 'POST',
            headers: { 'x-sync-token': token },
          });
          const payload = await response.json();
          if (!response.ok || !payload.ok) throw new Error(payload.error || 'Request failed');
          render(payload);
          setStatus(dryRun ? 'Preview loaded.' : 'Publish request complete. Check each card result.');
        } catch (error) {
          setStatus(error.message || 'Request failed.', true);
        } finally {
          setBusy(false);
        }
      }

      document.getElementById('preview').addEventListener('click', () => run(true));
      document.getElementById('publish').addEventListener('click', () => run(false));
    </script>
  </body>
</html>
